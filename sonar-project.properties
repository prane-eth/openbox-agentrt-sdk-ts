# The sonar steps in .github/workflows/{release,pr-quality}.yml no-op cleanly
# if SONAR_TOKEN/SONAR_HOST_URL are unset.
sonar.projectKey=openbox-agentrt-governance-ts
sonar.projectName=OpenBox Agent-RT Governance SDK (TS)
sonar.organization=openbox-ai

sonar.sources=src
sonar.tests=test
sonar.exclusions=dist/**,node_modules/**,coverage/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
